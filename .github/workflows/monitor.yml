name: 🌿 植物自动监控

on:
  schedule:
    # 每15分钟运行一次 (UTC时间，北京时间需要+8)
    - cron: '*/15 * * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 安装 Playwright 浏览器
        run: npx playwright install chromium --with-deps

      - name: 运行监控
        run: node src/monitor.js --once
        env:
          # 从 GitHub Secrets 读取敏感信息
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: 提交状态更新
        if: always()
        run: |
          if [ -f data/last-state.json ]; then
            git config --local user.email "plant-monitor[bot]@users.noreply.github.com"
            git config --local user.name "植物监控机器人"
            git add data/last-state.json
            git diff --staged --quiet || git commit -m "📊 更新监控状态 [skip ci]"
            git push || echo "推送失败（不影响主流程）"
          else
            echo "状态文件不存在，跳过提交"
          fi
